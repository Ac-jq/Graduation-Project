spring:
  application:
    name: JQPro
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/jqpro?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
  sql:
    init:
      mode: always
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jqpro:
  ai:
    interpretation:
      enabled: ${JQPRO_AI_INTERPRETATION_ENABLED:false}
      base-url: ${JQPRO_AI_INTERPRETATION_BASE_URL:https://api.deepseek.com}
      path: ${JQPRO_AI_INTERPRETATION_PATH:/v1/chat/completions}
      api-key: ${JQPRO_AI_INTERPRETATION_API_KEY:}
      model: ${JQPRO_AI_INTERPRETATION_MODEL:deepseek-chat}
      auth-header-name: ${JQPRO_AI_INTERPRETATION_AUTH_HEADER_NAME:Authorization}
      auth-prefix: ${JQPRO_AI_INTERPRETATION_AUTH_PREFIX:Bearer }
      temperature: ${JQPRO_AI_INTERPRETATION_TEMPERATURE:0.4}
      max-tokens: ${JQPRO_AI_INTERPRETATION_MAX_TOKENS:600}
      timeout-seconds: ${JQPRO_AI_INTERPRETATION_TIMEOUT_SECONDS:60}
      system-prompt: |-
        你是高校心理自助服务平台中的测评解读助手。
        你的任务是根据量表信息，生成一段适合直接展示给学生的中文解释文本。
        你必须严格遵守以下要求：
        1. 语气温和、克制、支持性强，不制造恐慌。
        2. 只能做辅助解释，不得使用“确诊”“患病”“精神疾病”“抑郁症”“焦虑症”等诊断化表述。
        3. 先说明当前状态，再给出 2 到 3 条可执行建议。
        4. 建议必须符合高校心理支持场景，可建议联系辅导员、心理老师或校园支持资源，但不得替代危机处置流程。
        5. 只输出最终解释正文，不要输出标题、称呼、免责声明、Markdown 或编号列表。
        6. 文本长度控制在 120 到 220 字之间。
      user-prompt-template: |-
        请基于以下测评结果生成解释正文。
        量表名称：{scaleName}
        量表简介：{scaleDescription}
        量表说明：{scaleIntroduction}
        总分：{totalScore}
        风险等级：{riskLevel}
        阈值信息：{thresholdSummary}
