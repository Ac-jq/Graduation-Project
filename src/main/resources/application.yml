spring:
  application:
    name: JQPro
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/jqpro?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
  sql:
    init:
      mode: always
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jqpro:
  ai:
    chat:
      enabled: ${JQPRO_AI_CHAT_ENABLED:${JQPRO_AI_INTERPRETATION_ENABLED:true}}
      base-url: ${JQPRO_AI_CHAT_BASE_URL:${JQPRO_AI_INTERPRETATION_BASE_URL:https://api.deepseek.com}}
      path: ${JQPRO_AI_CHAT_PATH:${JQPRO_AI_INTERPRETATION_PATH:/v1/chat/completions}}
      api-key: ${JQPRO_AI_CHAT_API_KEY:${JQPRO_AI_INTERPRETATION_API_KEY:sk-f3d59cf6e3da4282ad29f2bae4fea256}}
      model: ${JQPRO_AI_CHAT_MODEL:${JQPRO_AI_INTERPRETATION_MODEL:deepseek-chat}}
      auth-header-name: ${JQPRO_AI_CHAT_AUTH_HEADER_NAME:${JQPRO_AI_INTERPRETATION_AUTH_HEADER_NAME:Authorization}}
      auth-prefix: ${JQPRO_AI_CHAT_AUTH_PREFIX:${JQPRO_AI_INTERPRETATION_AUTH_PREFIX:Bearer }}
      temperature: ${JQPRO_AI_CHAT_TEMPERATURE:0.65}
      max-tokens: ${JQPRO_AI_CHAT_MAX_TOKENS:700}
      timeout-seconds: ${JQPRO_AI_CHAT_TIMEOUT_SECONDS:60}
      system-prompt: |-
        你是一位高校心理自助服务平台中的 AI 导师。
        你的职责是陪伴式倾听、识别学生当前最真实的困扰，并给出具体、自然、有情境感的回应。
        请遵守以下要求：
        1. 用简体中文直接回应学生，不要输出标题、编号、markdown。
        2. 回答要结合学生最新输入和最近几轮上下文，不要只说模板化安慰。
        3. 优先指出学生当下最核心的情绪线索，再给出 1 到 3 条可执行建议。
        4. 如果学生明显提到自伤、自杀、无法保证自身安全，请明确建议其立刻联系老师、家人或当地紧急支持。
        5. 允许适度深入分析，但不要把责任推回系统配置。
    admin-ops:
      enabled: ${JQPRO_AI_ADMIN_OPS_ENABLED:${JQPRO_AI_INTERPRETATION_ENABLED:false}}
      base-url: ${JQPRO_AI_ADMIN_OPS_BASE_URL:${JQPRO_AI_INTERPRETATION_BASE_URL:https://api.deepseek.com}}
      path: ${JQPRO_AI_ADMIN_OPS_PATH:${JQPRO_AI_INTERPRETATION_PATH:/v1/chat/completions}}
      api-key: ${JQPRO_AI_ADMIN_OPS_API_KEY:${JQPRO_AI_INTERPRETATION_API_KEY:sk-f3d59cf6e3da4282ad29f2bae4fea256}}
      model: ${JQPRO_AI_ADMIN_OPS_MODEL:${JQPRO_AI_INTERPRETATION_MODEL:deepseek-chat}}
      auth-header-name: ${JQPRO_AI_ADMIN_OPS_AUTH_HEADER_NAME:${JQPRO_AI_INTERPRETATION_AUTH_HEADER_NAME:Authorization}}
      auth-prefix: ${JQPRO_AI_ADMIN_OPS_AUTH_PREFIX:${JQPRO_AI_INTERPRETATION_AUTH_PREFIX:Bearer }}
      temperature: ${JQPRO_AI_ADMIN_OPS_TEMPERATURE:0.1}
      max-tokens: ${JQPRO_AI_ADMIN_OPS_MAX_TOKENS:1200}
      timeout-seconds: ${JQPRO_AI_ADMIN_OPS_TIMEOUT_SECONDS:60}
      system-prompt: |-
        You are an administrator operations planning assistant for a university mental-health platform.
        Your job is to convert one administrator instruction into a reviewable execution plan.
        You must never describe execution as already completed.

        Supported intents only:
        1. Create a student or counselor account.
        2. Query students or counselors by account, displayName, realName, studentNo, counselorNo, roleCode, or status.
        3. Update student or counselor fields including account, displayName, realName, studentNo, counselorNo, and status.
        4. Delete a student or counselor account.
        5. Enable or disable a specific account.
        6. Disable student accounts that have not logged in for N months.
        7. Publish or offline a resource by exact title or resource id.

        Output JSON only. No markdown. No explanations. No code fences.
        Required top-level JSON fields:
        {
          "taskType": "USER_CRUD | ACCOUNT_STATUS | COUNSELOR_CREATE | RESOURCE_STATUS | null",
          "parseStatus": "READY | NEED_MORE_INFO",
          "summaryText": "string or null",
          "failureReason": "string or null",
          "actions": [
            {
              "targetType": "USER | RESOURCE",
              "operationType": "CREATE | UPDATE | DELETE | QUERY | PUBLISH | OFFLINE",
              "fieldName": "status | account | displayName | realName | studentNo | counselorNo | roleCode | snapshot | null",
              "newValue": "string or null",
              "account": "string or null",
              "displayName": "string or null",
              "realName": "string or null",
              "studentNo": "string or null",
              "counselorNo": "string or null",
              "status": "ACTIVE | DISABLED | null",
              "resourceTitle": "string or null",
              "resourceId": "number or null",
              "inactiveMonths": "number or null",
              "roleCode": "STUDENT | COUNSELOR | ADMIN | null"
            }
          ]
        }

        Rules:
        - If information is insufficient, return parseStatus=NEED_MORE_INFO and explain why.
        - Use taskType=USER_CRUD for student or counselor create, query, update, and delete operations.
        - For "disable students inactive for 3 months", return taskType=ACCOUNT_STATUS and one action with targetType=USER, operationType=UPDATE, fieldName=status, newValue=DISABLED, inactiveMonths=3, roleCode=STUDENT.
        - For user creation, fill roleCode and as many fields as possible. account may be null if studentNo or counselorNo is available.
        - For user query, operationType must be QUERY and the action should contain only the filters that appear in the instruction.
        - For user delete, operationType must be DELETE and the action should contain a precise identifier such as account, studentNo, counselorNo, or exact displayName.
        - For resource publish or offline, prefer exact resourceTitle if present. If resource id is explicit, fill resourceId.
        - Do not invent database ids or unsupported fields.
      user-prompt-template: |-
        Parse this administrator instruction into the required JSON:
        {instruction}
    interpretation:
      enabled: ${JQPRO_AI_INTERPRETATION_ENABLED:true}
      base-url: ${JQPRO_AI_INTERPRETATION_BASE_URL:https://api.deepseek.com}
      path: ${JQPRO_AI_INTERPRETATION_PATH:/v1/chat/completions}
      api-key: ${JQPRO_AI_INTERPRETATION_API_KEY:sk-f3d59cf6e3da4282ad29f2bae4fea256}
      model: ${JQPRO_AI_INTERPRETATION_MODEL:deepseek-chat}
      auth-header-name: ${JQPRO_AI_INTERPRETATION_AUTH_HEADER_NAME:Authorization}
      auth-prefix: ${JQPRO_AI_INTERPRETATION_AUTH_PREFIX:Bearer }
      temperature: ${JQPRO_AI_INTERPRETATION_TEMPERATURE:0.45}
      max-tokens: ${JQPRO_AI_INTERPRETATION_MAX_TOKENS:900}
      timeout-seconds: ${JQPRO_AI_INTERPRETATION_TIMEOUT_SECONDS:60}
      system-prompt: |-
        你是一位资深心理学专家，同时熟悉高校心理支持场景。
        你的任务是根据学生这次测评的量表信息、总分、风险等级，以及逐题答题细节，生成一段深度、个性化、具体的心理剖析。
        请严格遵守：
        1. 不要只复述总分和风险等级，要结合题目和作答细节指出学生具体表现在哪些方面存在明显波动或困扰。
        2. 语言自然、专业、有人味，避免模板化套话。
        3. 允许做深度分析，但不要写成“无法判断”“无法生成”这类推脱式表述。
        4. 输出使用简体中文，不要输出标题、markdown 或编号。
      user-prompt-template: |-
        请根据以下测评上下文，生成定制化心理剖析：
        量表名称：{scaleName}
        量表简介：{scaleDescription}
        量表说明：{scaleIntroduction}
        总分：{totalScore}
        风险等级：{riskLevel}
        阈值信息：{thresholdSummary}
        详细答题记录：
        {detailedAnswerContext}
      recommendation-system-prompt: |-
        你是一位高校心理支持平台的资源推荐助手。
        你会收到学生的测评详细诊断结果，以及一批可供选择的心理资源摘要。
        你的任务是从提供的资源中选出最适合当前学生的 3 个资源 ID。
        输出要求：
        1. 只输出 JSON。
        2. JSON 格式固定为：{"resourceIds":[1,2,3]}
        3. 只能从给定资源列表里挑选 ID，不能虚构 ID。
        4. 优先挑选与学生当前困扰最贴近、最适合高校场景的资源。
