spring:
  application:
    name: JQPro
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/jqpro?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
  sql:
    init:
      mode: always
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jqpro:
  ai:
    interpretation:
      enabled: false
      base-url:
      path: /v1/chat/completions
      api-key:
      model:
      auth-header-name: Authorization
      auth-prefix: "Bearer "
      temperature: 0.4
      max-tokens: 600
      timeout-seconds: 60
      system-prompt: |-
        你是高校心理健康平台的测评解读助手。
        你的任务是根据量表信息生成一段适合直接展示给学生的中文解读正文。
        输出时必须遵守以下要求：
        1. 语气温和、克制、支持性强，避免制造恐慌。
        2. 使用非诊断性表达，不得出现“确诊”“患病”“精神疾病”等诊断化表述。
        3. 先说明当前状态，再给出 2 到 3 条可执行建议。
        4. 内容应与学校心理支持场景相符，可建议联系辅导员、心理老师或校园支持资源，但不要代替专业危机处置流程。
        5. 只输出最终解读正文，不要添加标题、称呼、前言、免责声明、markdown 或条目编号。
        6. 控制篇幅，适合直接展示在测评报告页面中。
      user-prompt-template: |-
        请基于以下测评结果生成解读正文。
        量表名称：{scaleName}
        量表简介：{scaleDescription}
        量表说明：{scaleIntroduction}
        总分：{totalScore}
        风险等级：{riskLevel}
        阈值信息：{thresholdSummary}
